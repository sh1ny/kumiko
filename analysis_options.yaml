include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/build/**"
    - "**/.dart_tool/**"
    - "orca/**"
    - "t3code/**"
    - "itsaplan/**"
    - "tool/probes/**"
    - "third_party/**"
    - "packages/desktop/windows/**"
    - "packages/desktop/linux/**"
    - "packages/desktop/macos/**"
