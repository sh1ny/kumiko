name: kumiko_workspace
description: Kumiko pub workspace root.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/domain
  - packages/host_protocol
  - packages/process_containment
  - packages/host
  - packages/desktop

# The terminal engine's native crate, built from the vendored, patched
# Alacritty core (ADR 0010; third_party/alacritty_terminal/KUMIKO.md), and
# its Dart package with a patched painter (third_party/flutter_alacritty).
dependency_overrides:
  flutter_alacritty:
    path: third_party/flutter_alacritty
  rust_lib_flutter_alacritty:
    path: third_party/rust_lib_flutter_alacritty

dev_dependencies:
  lints: ^6.0.0
  path: ^1.9.1
  test: ^1.31.1
  yaml: ^3.1.4
