name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb vttest

      # The terminal engine bar test runs vttest live on Linux and macOS
      # (openspec/changes/archive/2026-10-31-host-terminals/spike-results.md).
      - name: Install vttest
        if: runner.os == 'macOS'
        run: brew install vttest

      # Flutter (with its bundled Dart) and Rust come from mise.toml, the same
      # pins as local development. The terminal engine's native crate builds
      # from the vendored, patched Alacritty core (third_party/; ADR 0010)
      # through cargokit, which adds the macOS universal targets itself.
      - name: Install tools from mise.toml
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/rust_lib_flutter_alacritty/rust

      - name: Resolve workspace
        run: mise exec -- flutter pub get

      - name: Audit dependencies
        run: mise run audit

      - name: Check formatting
        run: mise run format:check

      - name: Analyze
        run: mise run analyze

      - name: Test
        run: mise run test

      # The release contract test (packages/host/test/it/release_contract_test.dart)
      # runs with the host package tests above; it builds the release host itself.

      - name: Build release host
        run: mise run build:host

      - name: Desktop integration test
        working-directory: packages/desktop
        run: |
          # KUMIKO_HOST names an external bundle: rebuilding the Linux app
          # wipes its bundle, and modifying a macOS debug .app breaks signing.
          # Agent fixtures require the test host; other integration tests
          # continue to exercise the release host.
          # One `flutter test` per file: a desktop app relaunched for a second
          # file in the same run fails to start ("Unable to start the app").
          release_host="$PWD/../host/build/host/bundle/bin/kumiko_host"
          set -e
          for file in integration_test/*_test.dart; do
            case "$file" in
              integration_test/agent_test.dart|integration_test/agent_reopen_test.dart|integration_test/exit_reopen_test.dart)
                host="$PWD/../host/build/host-test/bundle/bin/kumiko_host_test" ;;
              *) host="$release_host" ;;
            esac
            case "$RUNNER_OS" in
              Windows) mise exec -- flutter test "$file" -d windows --dart-define=KUMIKO_HOST="$(cygpath -w "$host.exe")" ;;
              Linux) xvfb-run -a mise exec -- flutter test "$file" -d linux --dart-define=KUMIKO_HOST="$host" ;;
              macOS) mise exec -- flutter test "$file" -d macos --dart-define=KUMIKO_HOST="$host" ;;
            esac
          done

      # Throughput runs in a profile build, as a user would see it. CI VMs
      # render in software, so frame times are printed but judged only on real
      # hardware (KUMIKO_GATE_FRAMES; spike-results.md).
      - name: Desktop integration test (profile)
        working-directory: packages/desktop
        run: |
          host="$PWD/../host/build/host/bundle/bin/kumiko_host"
          set -e
          for file in integration_test/profile/*_test.dart; do
            args=(--profile --driver=test_driver/integration_test.dart --target="$file")
            case "$RUNNER_OS" in
              Windows) mise exec -- flutter drive "${args[@]}" -d windows --dart-define=KUMIKO_HOST="$(cygpath -w "$host.exe")" ;;
              Linux) xvfb-run -a mise exec -- flutter drive "${args[@]}" -d linux --dart-define=KUMIKO_HOST="$host" ;;
              macOS) mise exec -- flutter drive "${args[@]}" -d macos --dart-define=KUMIKO_HOST="$host" ;;
            esac
          done

      - name: Build desktop release with the host bundled
        run: |
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          (cd packages/desktop && mise exec -- flutter build "$os" --release)
          mise exec -- dart run tool/bundle_host.dart --skip-build
          case "$RUNNER_OS" in
            Windows) bundle=packages/desktop/build/windows/x64/runner/Release; exe=host/bin/kumiko_host.exe ;;
            Linux) bundle=packages/desktop/build/linux/x64/release/bundle; exe=host/bin/kumiko_host ;;
            macOS) bundle=packages/desktop/build/macos/Build/Products/Release/Kumiko.app; exe=Contents/MacOS/host/bin/kumiko_host ;;
          esac
          test -x "$bundle/$exe"
          # The host ships the open-source ConPTY beside it (design D2).
          if [ "$RUNNER_OS" = Windows ]; then
            test -f "$bundle/host/lib/conpty.dll"
            test -f "$bundle/host/lib/OpenConsole.exe"
          fi
          # tar keeps the executable bits and the macOS framework symlinks.
          tar -czf "kumiko-$os.tar.gz" -C "$(dirname "$bundle")" "$(basename "$bundle")"

      - uses: actions/upload-artifact@v4
        with:
          name: kumiko-${{ runner.os }}
          path: kumiko-*.tar.gz
          if-no-files-found: error
