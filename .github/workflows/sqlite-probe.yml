# Temporary: SQLite binding probe for ADR 0008 (task 1.1). Removed in task 9.4.
name: sqlite-probe

on:
  push:
    branches: ['probe/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Run probe
        working-directory: tool/probes/sqlite
        run: |
          dart run_probe.dart | tee probe-${{ matrix.os }}.md
          cat probe-${{ matrix.os }}.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.os }}
          path: tool/probes/sqlite/probe-${{ matrix.os }}.md
